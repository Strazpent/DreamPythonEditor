; (rename, PO-06 phase 3, A246) The product was called Sumi. These redirects let a saved asset, a soft class path or a
; script that names an old reflected type find the renamed one. The ini sections of the settings are not class lookups:
; DreamLegacyMigration copies them once instead.
[CoreRedirects]
+ClassRedirects=(OldName="/Script/SumiEditor.SumiUserSettings", NewName="/Script/DreamEditor.DreamUserSettings")
+ClassRedirects=(OldName="/Script/SumiEditor.SumiPerProjectUserSettings", NewName="/Script/DreamEditor.DreamPerProjectUserSettings")
+ClassRedirects=(OldName="/Script/SumiEditor.SumiProjectTreeSettings", NewName="/Script/DreamEditor.DreamProjectTreeSettings")
+ClassRedirects=(OldName="/Script/SumiEditor.SumiProjectSettings", NewName="/Script/DreamEditor.DreamProjectSettings")
+ClassRedirects=(OldName="/Script/SumiEditorTests.SumiTestGetterFixture", NewName="/Script/DreamEditorTests.DreamTestGetterFixture")
+ClassRedirects=(OldName="/Script/SumiEditorTests.SumiTestOverrideFixture", NewName="/Script/DreamEditorTests.DreamTestOverrideFixture")
+ClassRedirects=(OldName="/Script/SumiEditorTests.SumiTestPropKindsFixture", NewName="/Script/DreamEditorTests.DreamTestPropKindsFixture")
+StructRedirects=(OldName="/Script/SumiEditor.SumiTabState", NewName="/Script/DreamEditor.DreamTabState")
+EnumRedirects=(OldName="/Script/SumiEditor.ESumiTabKind", NewName="/Script/DreamEditor.EDreamTabKind")
+EnumRedirects=(OldName="/Script/SumiEditor.ESumiOutputPosition", NewName="/Script/DreamEditor.EDreamOutputPosition")
+EnumRedirects=(OldName="/Script/SumiEditor.ESumiRunPresentationSetting", NewName="/Script/DreamEditor.EDreamRunPresentationSetting")
